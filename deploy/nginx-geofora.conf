# /etc/nginx/sites-available/geofora  (certbot --nginx añadirá el bloque HTTPS)
server {
    listen 80;
    server_name geofora.andresrami.com;

    root /opt/geofora/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # rutas del frontend como /pais/afganistan
    location / {
        try_files $uri /index.html;
    }
}
